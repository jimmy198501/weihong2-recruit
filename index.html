function seedRand(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0;}return Math.abs(h%100)/100;}
var TINY="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" fill="#ddd"/><circle cx="20" cy="20" r="10" fill="#aaa"/></svg>');
var DemoV="w3demo2";
DB.child("demov").once("value",function(vs){
  if(vs.val()!==DemoV){
    var recs={};
    bigCs().forEach(function(b){
      teamsOf(b).forEach(function(t){
        membersOf(b,t).forEach(function(n){
          var pk=b+"|"+t+"|"+n;
          var pct=seedRand(pk);
          recs[pk]={};
          tasksFor(b).forEach(function(tk){
            var cnt=Math.round(tk.goal*pct);
            for(var i=0;i<cnt;i++){
              var d=new Date(A_START);d.setDate(d.getDate()+i);
              var ds=d.toISOString().split("T")[0];
              if(!recs[pk][ds])recs[pk][ds]={ts:"demo"};
              recs[pk][ds][tk.key]=TINY;
            }
          });
        });
      });
    });
    DB.child("records").set(recs);
    DB.child("demov").set(DemoV);
  }
});

function bigCs(){return Object.keys(S.data);}
function teamsOf(b){return S.data[b]?Object.keys(S.data[b]):[];}
function membersOf(b,t){return(S.data[b]&&S.data[b][t])||[];}
function pk(b,t,n){return b+"|"+t+"|"+n;}
function tCnt(b,t,n,key){var r=S.records[pk(b,t,n)]||{};return Object.keys(r).filter(function(d){return d>=A_START&&d<=A_END&&r[d]&&r[d][key];}).length;}
function pPct(b,t,n){var tasks=tasksFor(b);var sum=0;tasks.forEach(function(tk){sum+=Math.min(tCnt(b,t,n,tk.key)/tk.goal,1);});return sum/tasks.length*100;}
function tPct(b,t){var m=membersOf(b,t);if(!m.length)return 0;return m.reduce(function(x,n){return x+pPct(b,t,n);},0)/m.length;}
function bPct(b){var all=[];teamsOf(b).forEach(function(t){membersOf(b,t).forEach(function(n){all.push({t:t,n:n});});});if(!all.length)return 0;return all.reduce(function(x,p){return x+pPct(b,p.t,p.n);},0)/all.length;}
function allPpl(){return bigCs().flatMap(function(b){return teamsOf(b).flatMap(function(t){return membersOf(b,t).map(function(n){return{big:b,team:t,name:n};});});});}

async function upload(file,b,t,n,key,date){
  var base64,mime,ext;
  if(file instanceof File){
    base64=await new Promise(function(res,rej){var r=new FileReader();r.onload=function(e){res(e.target.result.split(",")[1]);};r.onerror=rej;r.readAsDataURL(file);});
    mime=file.type||"image/jpeg";ext=mime.includes("png")?"png":"jpg";
  }else if(typeof file==="string"&&file.startsWith("data:")){
    var p=file.split(",");base64=p[1];mime=p[0].replace("data:","").replace(";base64","");ext=mime.includes("png")?"png":"jpg";
  }else throw new Error("格式不支援");
  var fn=[b,t,n,date,key].join("_").replace(/[|\\/\s]/g,"_")+"."+ext;
  var fd=new FormData();fd.append("data",base64);fd.append("filename",fn);fd.append("mimeType",mime);
  var res=await fetch(GAS,{method:"POST",body:fd});
  var j=await res.json();
  if(!j.success)throw new Error(j.error||"上傳失敗");
  return j.url;
}

async function doSubmit(){
  var today=twToday();
  if(!S.cBig||!S.cTeam||!S.cName)return sm("⚠️ 請選擇大C、隊伍、姓名");
  var key=pk(S.cBig,S.cTeam,S.cName);
  if(S.records[key]&&S.records[key][today])return sm("⚠️ 今天已提交過囉！");
  var ups=TASKS.filter(function(tk){return S.photos[tk.key];});
  if(!ups.length)return sm("⚠️ 請至少上傳一項完成任務的照片");
  S.busy=true;sm("上傳中（共"+ups.length+"張）⋯");
  try{
    var day={ts:new Date().toISOString()};
    for(var i=0;i<ups.length;i++){
      var tk=ups[i];
      var url=await upload(S.photos[tk.key],S.cBig,S.cTeam,S.cName,tk.key,today);
      day[tk.key]=url;sm("上傳中（"+(i+1)+"/"+ups.length+"）⋯");
    }
    await DB.child("records/"+key+"/"+today).set(day);
    S.photos={};sm("🎉 今日任務已記錄！");
  }catch(e){sm("❌ 上傳失敗："+e.message);}
  S.busy=false;R();
}
function sm(m){S.smsg=m;R();}

async function doMove(){
  var b=S.et.cBig,t=S.et.cTeam,n=S.et.name,f=S.et.from,to=S.et.to;
  if(!b||!t||!n||!f||!to)return em("⚠️ 請填寫完整欄位");
  if(f===to)return em("⚠️ 日期相同");
  var key=pk(b,t,n);
  var rec=(S.records[key]||{})[f];
  if(!rec)return em("⚠️ 來源日期沒有紀錄");
  if((S.records[key]||{})[to])return em("⚠️ 目標日期已有紀錄");
  await DB.child("records/"+key+"/"+to).set(Object.assign({},rec,{adminMoved:true}));
  await DB.child("records/"+key+"/"+f).remove();
  em("✅ 移動完成");S.et={cBig:"",cTeam:"",name:"",from:"",to:""};
}

function mCard(b,t,n){
  var p=pPct(b,t,n);var c=clr(p);
  var key=pk(b,t,n);var rec=S.records[key]||{};
  var h='<div class="mcard"><div class="mhead"><span class="mname">'+esc(n)+'</span><span class="mpct" style="color:'+c+'">'+Math.round(p)+'%</span></div>';
  h+='<div class="pbar-track" style="height:7px;margin-bottom:9px"><div class="pbar-fill" style="width:'+p+'%;background:'+c+'"></div></div>';
  var cardTasks=tasksFor(b);
  cardTasks.forEach(function(tk){
    var cnt=tCnt(b,t,n,tk.key);
    h+='<div class="mtask"><div class="mtlbl">'+tk.icon+' '+esc(tk.name.length>14?tk.name.substring(0,14)+'..':tk.name)+' '+cnt+'/'+tk.goal+tk.unit+'</div>';
    h+='<div class="dots">';
    for(var i=0;i<TOTAL;i++){
      var d=new Date(A_START);d.setDate(d.getDate()+i);
      var ds=d.toISOString().split("T")[0];
      h+='<div class="dot'+(rec[ds]&&rec[ds][tk.key]?' on':'')+'" title="第'+(i+1)+'天"></div>';
    }
    h+='</div></div>';
  });
  h+='</div>';
  return h;
}

  bcs.forEach(function(b){mopts+='<optgroup label="'+esc(b)+'">';teamsOf(b).forEach(function(t){membersOf(b,t).forEach(function(n){mopts+='<option value="'+esc(pk(b,t,n))+'">'+esc(n)+' ('+esc(t)+')</option>';});});mopts+='</optgroup>';});
  h+='<div class="msec"><div class="slbl">🗓️ 移動紀錄日期</div><div class="mgrow">';
  h+='<div><div class="flabel">姓名</div><select class="sel sm" id="etPK">'+mopts+'</select></div>';
  h+='<div><div class="flabel">來源日期</div><input type="date" class="sel sm" id="etF" value="'+S.et.from+'"></div>';
  h+='<div><div class="flabel">移至日期</div><input type="date" class="sel sm" id="etT" value="'+S.et.to+'"></div>';
  h+='<div><button class="mbtn" id="moveBtn">移動</button></div></div>';
  if(S.emsg)h+='<div class="msg '+(S.emsg.startsWith('✅')?'ok':'err')+'" style="margin-top:8px">'+esc(S.emsg)+'</div>';
  h+='</div>';

  // 逐人審核
  var sl=S.adminSort==="desc"?"🔽 天數高→低":S.adminSort==="asc"?"🔼 天數低→高":"↕️ 依完成天數排序";
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">';
  h+='<div class="slbl" style="margin-bottom:0">📷 逐人審核'+(S.adminSel.cBig?'　── '+esc(S.adminSel.cBig)+(S.adminSel.cTeam?' / '+esc(S.adminSel.cTeam):''):'')+'</div>';
  h+='<button class="mbtn" id="adminSortBtn" style="font-size:12px;padding:6px 12px">'+sl+'</button></div>';
  var filtered=ap.filter(function(p){
    if(S.adminSel.cBig&&p.big!==S.adminSel.cBig)return false;
    if(S.adminSel.cTeam&&p.team!==S.adminSel.cTeam)return false;
    return true;
  }).map(function(p){var r=S.records[pk(p.big,p.team,p.name)]||{};var days=Object.keys(r).filter(function(d){return d>=A_START&&d<=A_END;}).length;return{big:p.big,team:p.team,name:p.name,days:days};});
  if(S.adminSort==="desc")filtered.sort(function(a,b){return b.days-a.days;});
  else if(S.adminSort==="asc")filtered.sort(function(a,b){return a.days-b.days;});
  var any=false;
  filtered.forEach(function(p){
    var key2=pk(p.big,p.team,p.name);var rec=S.records[key2]||{};
    var dates=Object.keys(rec).sort();if(!dates.length)return;any=true;
    h+='<details class="amem"><summary>'+esc(p.name)+' <span class="atag">'+esc(p.big)+' / '+esc(p.team)+'</span><span class="acnt">'+p.days+' 天</span></summary>';
    dates.forEach(function(date){
      var r=rec[date];
      h+='<div class="aday"><div class="aday-row"><span>📅 '+date+'</span>';
      if(r.adminMoved)h+='<span style="font-size:10px;color:var(--acc)">已移動</span>';
      h+='<button class="dbtn" data-dpk="'+esc(key2)+'" data-dd="'+date+'">🗑️ 刪除</button></div>';
      h+='<div style="display:flex;flex-wrap:wrap">';
      TASKS.forEach(function(tk){if(r[tk.key])h+='<a href="'+r[tk.key]+'" target="_blank" class="ttag">'+tk.icon+' '+esc(tk.name.length>8?tk.name.substring(0,8)+'..':tk.name)+' 🔍</a>';});
      h+='</div></div>';
    });
    h+='</details>';
  });
  if(!any)h+='<div style="color:var(--mut);font-size:13px;padding:16px 0">目前無人打卡</div>';
  h+='</div>';
  return h;
}

function bind(){
  ["submit","view","admin"].forEach(function(k){var el=document.getElementById("tab_"+k);if(el)el.addEventListener("click",function(){S.tab=k;R();});});
  var sb=document.getElementById("selBig");if(sb)sb.addEventListener("change",function(){S.cBig=this.value;S.cTeam="";S.cName="";S.photos={};S.smsg="";R();});
  var st=document.getElementById("selTeam");if(st)st.addEventListener("change",function(){S.cTeam=this.value;S.cName="";S.photos={};S.smsg="";R();});
  var sn=document.getElementById("selName");if(sn)sn.addEventListener("change",function(){S.cName=this.value;S.photos={};S.smsg="";R();});
  document.querySelectorAll("[data-up]").forEach(function(box){box.addEventListener("click",function(){var fi=document.getElementById("fi_"+this.dataset.up);if(fi)fi.click();});});
  document.querySelectorAll("input[id^='fi_']").forEach(function(fi){var k=fi.id.replace("fi_","");fi.addEventListener("change",function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){S.photos[k]=e.target.result;R();};r.readAsDataURL(f);});});
  document.querySelectorAll("[data-rm]").forEach(function(btn){btn.addEventListener("click",function(ev){ev.stopPropagation();delete S.photos[this.dataset.rm];R();});});
  var sub=document.getElementById("submitBtn");if(sub)sub.addEventListener("click",doSubmit);
  var pw=document.getElementById("pwIn");var lb=document.getElementById("loginBtn");
  if(pw)pw.addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});
  if(lb)lb.addEventListener("click",doLogin);
  var vbs=document.getElementById("viewBigSel");if(vbs)vbs.addEventListener("change",function(){S.viewBig=this.value;S.viewSort="default";R();});
  var sortBtn=document.getElementById("sortBtn");if(sortBtn)sortBtn.addEventListener("click",function(){S.viewSort=S.viewSort==="default"?"desc":S.viewSort==="desc"?"asc":"default";R();});
  var adBig=document.getElementById("adBig");var adTeam=document.getElementById("adTeam");
  if(adBig)adBig.addEventListener("change",function(){S.adminSel.cBig=this.value;S.adminSel.cTeam="";R();});
  if(adTeam)adTeam.addEventListener("change",function(){S.adminSel.cTeam=this.value;R();});
  var etPK=document.getElementById("etPK");var etF=document.getElementById("etF");var etT=document.getElementById("etT");var mvb=document.getElementById("moveBtn");
  if(etPK)etPK.addEventListener("change",function(){var p=this.value.split("|");if(p.length===3){S.et.cBig=p[0];S.et.cTeam=p[1];S.et.name=p[2];}});
  if(etF)etF.addEventListener("change",function(){S.et.from=this.value;});
  if(etT)etT.addEventListener("change",function(){S.et.to=this.value;});
  if(mvb)mvb.addEventListener("click",doMove);
  var asb=document.getElementById("adminSortBtn");if(asb)asb.addEventListener("click",function(){S.adminSort=S.adminSort==="default"?"desc":S.adminSort==="desc"?"asc":"default";R();});
  document.querySelectorAll("[data-dpk]").forEach(function(btn){btn.addEventListener("click",function(){delRec(this.dataset.dpk,this.dataset.dd);});});
}
</script>
</body>
</html>
